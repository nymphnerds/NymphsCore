<svg width="600" height="810" viewBox="0 0 600 810" xmlns="http://www.w3.org/2000/svg" style="background:#03100e;font-family:'DM Mono','Consolas',monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#a9bbb5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="300" y="24" text-anchor="middle" font-size="12" font-weight="700" fill="#63e35f" letter-spacing="0.08em">// LLM routing pipeline</text>

  <!-- You type in Cline -->
  <rect x="190" y="36" width="220" height="44" rx="8" fill="#061816" stroke="#55dff0" stroke-width="1.4"/>
  <text x="300" y="63" text-anchor="middle" font-size="14" font-weight="700" fill="#55dff0">You type in Cline</text>

  <line x1="300" y1="80" x2="300" y2="104" stroke="#a9bbb5" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Side boxes drawn BEFORE diamond so diamond polygon renders on top of overlapping areas -->
  <rect x="18" y="166" width="164" height="44" rx="8" fill="#061816" stroke="#63e35f" stroke-width="1.4"/>
  <text x="100" y="183" text-anchor="middle" font-size="14" font-weight="700" fill="#f0ede6">Handle locally</text>
  <text x="100" y="199" text-anchor="middle" font-size="12" font-weight="700" fill="#63e35f">Fast &amp; free</text>

  <rect x="418" y="166" width="164" height="44" rx="8" fill="#061816" stroke="#ff7adf" stroke-width="1.4"/>
  <text x="500" y="188" text-anchor="middle" font-size="14" font-weight="700" fill="#f0ede6">llm_call tool</text>

  <!-- Diamond polygon drawn after side boxes so it covers any overlap -->
  <polygon points="300,104 390,188 300,272 210,188" fill="#061816" stroke="#63e35f" stroke-width="1.4"/>
  <!-- Diamond text drawn last so it is always on top -->
  <text x="300" y="183" text-anchor="middle" font-size="14" font-weight="700" fill="#f0ede6">Local AI 27B</text>

  <!-- Arrows out of diamond to side boxes -->
  <line x1="210" y1="188" x2="184" y2="188" stroke="#a9bbb5" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="390" y1="188" x2="416" y2="188" stroke="#a9bbb5" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="184" y="158" text-anchor="middle" font-size="11" font-weight="700" fill="#63e35f" stroke="#03100e" stroke-width="4" paint-order="stroke fill">Most tasks</text>
  <text x="416" y="158" text-anchor="middle" font-size="11" font-weight="700" fill="#63e35f" stroke="#03100e" stroke-width="4" paint-order="stroke fill">Complex</text>

  <!-- llm_call down to MCP Proxy -->
  <polyline points="500,210 500,290 412,290" fill="none" stroke="#a9bbb5" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- MCP Proxy -->
  <rect x="190" y="268" width="220" height="44" rx="8" fill="#061816" stroke="#55dff0" stroke-width="1.4"/>
  <text x="300" y="285" text-anchor="middle" font-size="14" font-weight="700" fill="#f0ede6">MCP Proxy</text>
  <text x="300" y="301" text-anchor="middle" font-size="12" font-weight="700" fill="#55dff0">port 8100</text>

  <line x1="300" y1="312" x2="300" y2="340" stroke="#a9bbb5" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Side boxes for second diamond drawn before polygon -->
  <rect x="18" y="398" width="164" height="44" rx="8" fill="#061816" stroke="#55dff0" stroke-width="1.4"/>
  <text x="100" y="415" text-anchor="middle" font-size="14" font-weight="700" fill="#f0ede6">Cached result</text>
  <text x="100" y="431" text-anchor="middle" font-size="12" font-weight="700" fill="#55dff0">Instant</text>

  <rect x="418" y="398" width="164" height="44" rx="8" fill="#061816" stroke="#ff8a2a" stroke-width="1.4"/>
  <text x="500" y="415" text-anchor="middle" font-size="14" font-weight="700" fill="#ff8a2a">OpenRouter API</text>

  <!-- Second diamond polygon drawn after side boxes -->
  <polygon points="300,340 390,420 300,500 210,420" fill="#061816" stroke="#ff7adf" stroke-width="1.4"/>
  <!-- Diamond text last -->
  <text x="300" y="414" text-anchor="middle" font-size="14" font-weight="700" fill="#f0ede6">Cached LLM</text>
  <text x="300" y="430" text-anchor="middle" font-size="12" font-weight="700" fill="#ff7adf">server</text>

  <!-- Arrows out of second diamond -->
  <line x1="210" y1="420" x2="184" y2="420" stroke="#a9bbb5" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="390" y1="420" x2="416" y2="420" stroke="#a9bbb5" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="184" y="390" text-anchor="middle" font-size="11" font-weight="700" fill="#63e35f" stroke="#03100e" stroke-width="4" paint-order="stroke fill">Cache hit</text>
  <text x="416" y="390" text-anchor="middle" font-size="11" font-weight="700" fill="#63e35f" stroke="#03100e" stroke-width="4" paint-order="stroke fill">First call</text>

  <!-- Converge to Local AI processes -->
  <polyline points="100,442 100,556 188,556" fill="none" stroke="#a9bbb5" stroke-width="1.4" marker-end="url(#arrow)"/>
  <polyline points="500,442 500,556 412,556" fill="none" stroke="#a9bbb5" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Local AI processes answer -->
  <rect x="190" y="534" width="220" height="44" rx="8" fill="#061816" stroke="#55dff0" stroke-width="1.4"/>
  <text x="300" y="551" text-anchor="middle" font-size="14" font-weight="700" fill="#f0ede6">Local AI</text>
  <text x="300" y="567" text-anchor="middle" font-size="12" font-weight="700" fill="#55dff0">processes answer</text>

  <line x1="300" y1="578" x2="300" y2="612" stroke="#a9bbb5" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Cloud AI responds -->
  <rect x="170" y="612" width="260" height="44" rx="8" fill="#061816" stroke="#ff8a2a" stroke-width="1.4"/>
  <text x="300" y="629" text-anchor="middle" font-size="14" font-weight="700" fill="#f0ede6">Cloud AI responds</text>
  <text x="300" y="645" text-anchor="middle" font-size="12" font-weight="700" fill="#ff8a2a">&amp; caches result</text>

  <line x1="300" y1="656" x2="300" y2="690" stroke="#a9bbb5" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Local AI incorporates -->
  <rect x="160" y="690" width="280" height="44" rx="8" fill="#061816" stroke="#63e35f" stroke-width="1.4"/>
  <text x="300" y="707" text-anchor="middle" font-size="14" font-weight="700" fill="#f0ede6">Local AI incorporates</text>
  <text x="300" y="723" text-anchor="middle" font-size="12" font-weight="700" fill="#63e35f">into response</text>

  <text x="300" y="786" text-anchor="middle" font-size="12" font-weight="700" fill="#63e35f" letter-spacing="0.08em">// service  // cache  // cloud</text>
</svg>
